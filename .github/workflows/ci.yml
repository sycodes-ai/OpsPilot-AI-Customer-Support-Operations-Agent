name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit and API tests (SQLite + PostgreSQL)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://opspilot:opspilot@localhost:5432/opspilot_test
        run: pytest
      - name: Agent evaluation (rules mode, dev set must pass 95%)
        run: |
          python eval/run_eval.py --min-pass 0.95
          python eval/run_eval.py --cases eval/holdout.yaml --out eval/results/holdout
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opspilot .
